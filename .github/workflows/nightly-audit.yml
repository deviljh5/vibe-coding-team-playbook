name: Nightly Audit

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  audit:
    name: Nightly Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run nightly audit
        run: ./scripts/nightly-audit.sh

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly Audit Failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `Automated nightly audit found issues.\n\nSee [workflow run](${context.payload.repository.html_url}/actions/runs/${context.runId}) for details.\n\nPlease review and fix.`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['automated', 'audit']
            });
